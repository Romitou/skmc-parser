# SkriptMC-Parser - Core Configuration
# This configuration file defines default runtime settings.
# Sensitive values (such as Redis credentials) should be overridden via environment variables
# (e.g. SKMC_REDIS_ADDRESS, SKMC_REDIS_USERNAME, SKMC_REDIS_PASSWORD) or config.local.yaml.

version: "1.0.0"

http:
  listen: "0.0.0.0"
  port: 8000

rateLimiter:
  limit: "1000-H"
  prefix: "limiter_skmcparser"

redis:
  address: "127.0.0.1:6379"
  username: ""
  password: ""
  db: 0
